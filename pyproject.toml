[project]
name = "auto-review-pr-dashboard"
version = "0.1.0"
description = "A PR review loop whose queue belongs to the dashboard instead of the agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.2,<9"]

[project.scripts]
auto-review-pr-dashboard = "auto_review_pr_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auto_review_pr_dashboard"]
